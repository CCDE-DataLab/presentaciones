name: Build SVM PDF

on:
  push:
    branches: [main]
    paths:
      - "Support Vector Machines/presentacion-svm.tex"
      - "Support Vector Machines/sections/**"
      - "Support Vector Machines/codigo_demo_svm.py"
      - ".github/workflows/build-svm-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-spanish

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy matplotlib scikit-learn

      - name: Generate SVM figures
        working-directory: "Support Vector Machines"
        run: python codigo_demo_svm.py

      - name: Compile Beamer presentation
        working-directory: "Support Vector Machines"
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error presentacion-svm.tex
          pdflatex -interaction=nonstopmode -halt-on-error presentacion-svm.tex

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Support Vector Machines/presentacion-svm.pdf"
          if git diff --cached --quiet; then
            echo "PDF already up to date."
          else
            git commit -m "build: render SVM presentation PDF"
            git push origin HEAD:main
          fi
